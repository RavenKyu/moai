[package]
name = "moai"
version = "0.15.0"
edition = "2024"
description = "이슈 트래커. 승인 게이트 없음. 규율은 `moai status` 가 비춘다."
license = "MIT"
repository = "https://github.com/buzzni/moai"
# **let-chain 이 쓰인다**(`src/cmd/mv.rs`·`src/cmd/defer.rs` 외). edition 2024 만으로는
# 1.85 지만 let-chain 은 1.88 부터다 — 안 적으면 그 사이 판을 든 사람이 cargo 의
# "1.88 이상이 필요하다" 대신 `expected expression, found keyword 'let'` 을 본다.
# README 가 그 밖의 기계에 소스 빌드를 대고 있어, 그 사람이 처음 받는 말이 이것이다.
rust-version = "1.88"

[dependencies]
# `wrap_help` 는 켜지 않는다 — 도움말에 실제 개행을 넣어 좁은 창에서 예시 명령이 복사하면
# 깨진다. 까닭은 src/cli.rs 의 `Cli` 위 주석에 있다 (moai-opjn).
clap          = { version = "4", features = ["derive", "color", "unicode"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
anstream      = "1"
anstyle       = "1"
unicode-width = "0.2"
# grapheme 으로 걷는다. ratatui 가 이미 끌고 오는 판이라 무게는 0 이다.
unicode-segmentation = "1"
fs2           = "0.4"
# 기본 기능을 끈다 — 달력 위젯은 `time` 을, 다른 백엔드는 termwiz 를 끌고 온다.
# crossterm 0.29 는 이미 로컬에 있던 판이라 그것을 그대로 쓴다.
ratatui       = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
# 사용자 설정(`user_config`)을 고쳐 쓸 때 모르는 키·주석·줄 모양을 보존한다.
# `serde` 기능은 끈다 — 표 배열 하나를 읽는 데 역직렬화가 필요 없다.
toml_edit     = { version = "0.25.15", default-features = false, features = ["parse", "display"] }
# 새 판이 났는지 GitHub 에 묻는 길(moai-omww, 사용자 결정 2026-09-21). **새 축의 의존성이라
# 먼저 상의한 자리다** — CLAUDE.md 가 개수와 무관하게 상의하라고 적은 그 자리고, 재서 대고 물었다.
# 고를 때 잰 표(빈 크레이트 308,752바이트에 **기본 기능으로** 얹어 잰 값이다): `ureq` 3 은
# +1,880,088바이트, `minreq`(https-rustls)는 +1,137,240바이트, `curl` 프로세스는 0바이트였다.
# 그런데도 크레이트를 고른 것은 curl 도 wget 도 없는 기계에서 이 기능이 영영 "못 물었다" 로
# 서기 때문이다.
#
# **이 저장소에서 실제로 든 값은 +1,775,096바이트다**(2026-09-22 에 쟀다 — 들이기 전
# 6,186,192바이트, 부르는 자리가 선 뒤 7,961,288바이트, 15MB 예산의 53%). **여기 적는 것은 든
# 값이지 지금 크기가 아니다** — 절대 수는 커밋마다 움직여, 읽는 사람이 무엇과 견줄지 모른다.
# 지금 크기는 `ls -l target/release/moai` 가 댄다. 위의 표와 다른 것은 기능을 깎아서다: `gzip` 을
# 끄면 `flate2` 가 안 따라오고, 답이 JSON 몇 KB 라 푸는 값도 없다.
ureq          = { version = "3", default-features = false, features = ["rustls"] }

# `access(X_OK)` 하나를 쓴다(`cmd::runnable`, moai-dhx9, 2026-09-23 사용자 결정) — 표준
# 라이브러리에 없다.
#
# **크레이트는 0개가 늘었다 — 어느 타깃에서나.** 그러자고 유닉스에만 건다: `fs2` 가 제 `libc` 를
# `[target."cfg(unix)".dependencies]` 로 걸어 유닉스에서는 이미 빌드 그래프에 서 있고, 윈도에서는
# `winapi` 가 그 자리에 선다. 맨 `[dependencies]` 에 두면 유닉스에서만 0개가 늘고 윈도에서는
# 하나가 느는데, 거기서는 쓰이지도 않는다 — 부르는 자리(`cmd::runnable`)가 `#[cfg(unix)]` 안이라
# 윈도 갈래는 `path.is_file()` 하나다.
#
# 이 저장소에서 든 비용은 **+5,960바이트**다(2026-09-23 에 쟀다 — 들이기 전 8,154,112바이트,
# 들인 뒤 8,160,072바이트, 15MB 예산의 54% 로 자리가 안 바뀐다). 클린 릴리스 빌드는
# 그대로였다(그날 228초) — `libc` 는 어차피 컴파일되던 것이다.
[target.'cfg(unix)'.dependencies]
libc          = "0.2"

# CI 의 ci-gate 가 clippy 를 `-D warnings` 로 돌린다. 그러니 여기 적힌 세 줄은
# "이건 경고가 아니다" 라는 선언이고, 줄마다 `#[allow]` 을 흩뿌리는 대신 까닭과
# 함께 한자리에 둔다. 새 줄을 더할 때도 까닭을 같이 적는다 — 까닭 없는 allow 는
# 다음 사람이 걷어도 되는지 못 가린다.
[lints.clippy]
# 지금 걸리는 자리는 일곱이다 — `cmd/add.rs` 의 `bulk`·`create_drafts`, `cmd/show.rs` 의 `one`,
# `hook.rs` 의 `closing`, `tui/stats.rs` 의 `count`, `view.rs` 의 `list`·`ready`(2026-10-06 에 이 줄을
# `warn` 으로 내려 셌다 — 둘로 적혀 있던 동안 넷이 말없이 늘었다, 리뷰 moai-084j.ghf).
# (`hook.rs` 의 `guard_shell_in` 도 여기 있었는데, `Scan` 이 명령줄과 설정을 한 인자로
# 묶으며 문턱 아래로 내려갔다 — moai-a1if.) `create_drafts` 와 `one` 은 `&[Issue]` 와 설정·사람·자리를
# 통째로 받아 답만 내는 함수라, 인자를 구조체로 묶으면 그 구조체가 호출자마다 다른 것을
# 담게 된다 — 옛 moai 가 상태를 키운 길이 그것이다. `closing` 은 경고 수와 기준선이 한 값이 아니고,
# 말과 자리는 부르는 쪽마다 다르다. **어느 자리를 산 allow 인지 적어 둔다**: 안 적으면 다음 사람이
# 걷어도 되는지 못 가린다.
too_many_arguments = "allow"
# 반환 튜플의 모양이 곧 계약이다. `type` 별칭을 씌우면 부르는 쪽에서 무엇이
# 나오는지 안 보인다. 걸리는 자리는 `model.rs`·`report.rs`·`tui/keys.rs`·`worktree.rs`·`tz.rs`(`parse`)·`hook.rs`·
# `store.rs`·`cmd/hook.rs`·`cmd/init.rs`·`tui/layer.rs` 열 파일이다(2026-09-30 에 이 줄을 `warn` 으로 내려 셌다 —
# 넷으로 적혀 있던 동안 뒤의 다섯이 말없이 늘었다, 리뷰 moai-efoc.3e1).
type_complexity = "allow"
# `projects::State` 는 실패한 까닭을 통째로 들고 온다. 박싱하면 그 값을 읽는 자리가
# 모두 한 겹 깊어지는데, 이 경로는 사람이 한 번 부르는 명령이라 값어치가 없다.
# 걸리는 자리는 `projects.rs` 하나다.
result_large_err = "allow"
# 같은 `projects::State` 의 `Open` 갈래는 `Repo`(설정을 통째로 든다)와 `Load` 를 들어 다른 갈래보다
# 200바이트 넘게 크다 — 설정에 `archive_days` 가 더해지며 문턱을 넘었다(moai-47mz, 리뷰 moai-47mz.5il).
# 위와 같은 까닭으로 박싱하지 않는다: 프로젝트마다 한 번 짓고 읽는 값이라, 박싱하면 읽는 자리만 한 겹
# 깊어진다. 걸리는 자리는 `projects.rs` 하나다.
large_enum_variant = "allow"

[profile.release]
lto = true
strip = true
